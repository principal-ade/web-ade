version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules .next
        - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        - echo "@industry-theme:registry=https://registry.npmjs.org/" >> .npmrc
        - echo "@principal-ade:registry=https://registry.npmjs.org/" >> .npmrc
        - echo "@principal-ai:registry=https://registry.npmjs.org/" >> .npmrc
        - echo "legacy-peer-deps=true" >> .npmrc
        - npm install
        - npm list @tailwindcss/postcss tailwindcss
    build:
      commands:
        - env | grep -e SESSION_SECRET -e APP_URL -e AUTH_SERVER_URL -e MESSAGING_SERVER_URL -e NODE_ENV -e GITHUB_TOKEN -e NPM_TOKEN -e GOOGLE_AI_API_KEY -e NEXT_PUBLIC_GA_ID >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
