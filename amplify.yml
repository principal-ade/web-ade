version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules .next
        - npm ci
        - npm list @tailwindcss/postcss tailwindcss
    build:
      commands:
        - env | grep -e SESSION_SECRET -e APP_URL -e LANDING_PAGE_URL -e MESSAGING_SERVER_URL -e NODE_ENV >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
