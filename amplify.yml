version: 1
# Updated to Node.js 24 LTS - optimized build caching enabled
env:
  variables:
    # Version registry configuration
    SERVICE_REPOSITORY_URL: https://github.com/principal-ade/web-ade
frontend:
  phases:
    preBuild:
      commands:
        - export SERVICE_COMMIT_SHA=$AWS_COMMIT_ID
        - nvm install 24
        - nvm use 24
        - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        - echo "@industry-theme:registry=https://registry.npmjs.org/" >> .npmrc
        - echo "@principal-ade:registry=https://registry.npmjs.org/" >> .npmrc
        - echo "@principal-ai:registry=https://registry.npmjs.org/" >> .npmrc
        - echo "legacy-peer-deps=true" >> .npmrc
        - npm install
        - npm list @tailwindcss/postcss tailwindcss
    build:
      commands:
        - env | grep -e SESSION_SECRET -e APP_URL -e AUTH_SERVER_URL -e MESSAGING_SERVER_URL -e NODE_ENV -e GITHUB_TOKEN -e NPM_TOKEN -e GOOGLE_AI_API_KEY -e NEXT_PUBLIC_GA_ID -e NEXT_PUBLIC_TRAFFIC_CONTROLLER_URL -e ELEVENLABS_API_KEY -e ELEVENLABS_VOICE_ID -e ELEVENLABS_MODEL_ID -e TTS_AWS_REGION -e TTS_S3_BUCKET -e CDN_DOMAIN -e VERSION_REGISTRY_S3_BUCKET -e VERSION_REGISTRY_AWS_REGION -e OTEL_EXPORTER_OTLP_ENDPOINT -e OTEL_EXPORTER_OTLP_HEADERS -e OTEL_SERVICE_NAME -e OTEL_SERVICE_VERSION -e OTEL_RESOURCE_ATTRIBUTES -e SERVICE_REPOSITORY_URL -e SERVICE_COMMIT_SHA >> .env.production
        - export NODE_OPTIONS="--max_old_space_size=4096"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
